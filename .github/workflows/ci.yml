name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Studio source and bundled UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check types and frontend behavior
        working-directory: web
        run: npm run check && npm test
      - name: Rebuild the default Studio
        working-directory: web
        run: npm run build
      - name: Reject source-to-bundle drift
        run: python3 scripts/check_frontend_bundle.py

  native-quality:
    name: Native quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        # Pinned to setup-uv v8.1.0 so a mutable action tag cannot change CI.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.30"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --extra dev --locked

      - name: Run the platform-neutral quality gate
        run: uv run --extra dev python scripts/check.py

      - name: Prove native hardware inspection works
        run: uv run whoopy doctor --json
