# Provisional model adapter registry. Phase 3.5 implements the universal
# llama.cpp and sherpa-onnx classes; a later PR validates and constructs these
# declarations through the normal CLI.
#
# A backend is replaceable when it implements the relevant typed port. Keep
# prompt formatting, sampling quirks, voice controls, and runtime errors inside
# that adapter rather than branching on model names in the pipeline.
