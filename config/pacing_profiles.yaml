# Reviewed product-level pacing policy. Breath timing belongs to the reviewed
# breath-protocol registry and is deliberately absent here.
schema_version: 1
registry_id: whoopy-local-pacing
profiles:
  - profile_id: meditative-v2
    version: 2
    label: Meditative
    speech_speed: 0.6
    silence_strategy: preserve
    allowed_timeline_mutations: []
  - profile_id: progressive-quiet-v2
    version: 2
    label: Progressive quiet
    speech_speed: 0.55
    silence_strategy: progressive_quiet
    allowed_timeline_mutations: [SILENCE.duration_ms]
  - profile_id: slow_sleep
    version: 1
    label: Slow sleep
    speech_speed: 0.55
    silence_strategy: preserve
    allowed_timeline_mutations: []
  - profile_id: focus
    version: 1
    label: Focus
    speech_speed: 0.65
    silence_strategy: preserve
    allowed_timeline_mutations: []
  - profile_id: daytime
    version: 1
    label: Daytime
    speech_speed: 0.7
    silence_strategy: preserve
    allowed_timeline_mutations: []
